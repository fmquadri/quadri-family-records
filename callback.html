<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Authorization Callback — Quadri Family Records</title>
<style>body{font-family:Georgia,serif;max-width:42rem;margin:3rem auto;padding:0 1rem;line-height:1.6;color:#222}code{background:#f4f4f4;padding:.15em .4em;border-radius:3px;word-break:break-all}</style>
</head>
<body>
<h1>Authorization received</h1>
<p id="msg">Forwarding to the local application…</p>
<noscript><p>JavaScript is disabled. Copy the full address of this page from the address bar and paste it into the local application.</p></noscript>
<script>
// Forwards the OAuth authorization response (code + state, in the query string)
// to the family's local application. No data is stored or sent anywhere else;
// this page is static and has no backend.
(function () {
  var q = window.location.search;
  if (q && q.length > 1) {
    window.location.replace("http://localhost:8347/callback" + q);
  } else {
    document.getElementById("msg").textContent =
      "No authorization parameters found. If you reached this page from a sign-in flow, copy the full address from the address bar into the local application.";
  }
})();
</script>
</body>
</html>
